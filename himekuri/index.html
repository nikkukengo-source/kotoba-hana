<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日めくり">
<meta name="theme-color" content="#f3ece4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>今日のことば 日めくり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 四季の水彩画から、タップすると今日の季節へ近づき、今月の水彩画に場面が変わって、今日の日付とことばが浮かび上がる */
:root {
  --a: #b8502b; --b: #e08a3c; --ink: #3d3346; --sub: #6f6476;
  --round: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #f3ece4; color: var(--ink); font-family: var(--round); }

/* 画面いっぱいの絵（2枚を重ねて、場面を切り替える） */
.layer { position: fixed; inset: 0; background: center/cover no-repeat; }
#cover { z-index: 1; transform-origin: var(--ox, 50%) var(--oy, 50%);
  transition: transform 2.2s cubic-bezier(.55,.05,.35,1), opacity 1.2s ease 1.3s, filter 2s ease; }
#month { z-index: 0; transform: scale(1.12); transition: transform 3.2s cubic-bezier(.2,.7,.2,1) 1s; }
.go #cover { transform: scale(2.6); opacity: 0; filter: blur(2px); }
.go #month { transform: scale(1); }

/* はじめの画面の文字 */
.start { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  border: 0; padding: 0; background: none; font-family: var(--round); color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: opacity .7s ease; }
.go .start { opacity: 0; pointer-events: none; }
.start .box { background: rgba(255,253,248,.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border-radius: 26px; padding: 22px 30px 20px; box-shadow: 0 10px 30px rgba(60,40,30,.15); max-width: 84vw; }
.start .t1 { font-size: clamp(30px, 5.2dvh, 40px); font-weight: 900; letter-spacing: .16em; color: #5b4a6e; }
.start .t2 { font-size: 17px; font-weight: 700; color: #7a6a88; letter-spacing: .14em; margin-top: 4px; }
.start .t3 { margin-top: 14px; font-size: 19px; font-weight: 700; color: #b8502b; letter-spacing: .08em; animation: hint 2.2s ease-in-out infinite; }
@keyframes hint { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }

/* 今日の画面 */
.today { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding: max(12px, env(safe-area-inset-top, 0px)) 14px max(14px, env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.go .today { pointer-events: auto; }
.chip { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: max(12px, env(safe-area-inset-top, 0px));
  background: var(--a); color: #fff; font-weight: 700; font-size: 15px; letter-spacing: .08em; padding: 6px 14px; border-radius: 999px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18); opacity: 0; transition: opacity .8s ease 2.4s; }
.badge { position: relative; width: clamp(110px, 18dvh, 160px); aspect-ratio: 1; flex: none; opacity: 0; transform: scale(.5);
  transition: opacity .7s ease 2.6s, transform .9s cubic-bezier(.3,1.6,.5,1) 2.6s; }
.badge svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 4px 10px rgba(0,0,0,.18)); }
.badge .d { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; color: var(--a);
  font-size: clamp(56px, 10dvh, 88px); line-height: 1; letter-spacing: -.02em; padding-bottom: 4%; }
.dateline { flex: none; margin: 6px 0 10px; font-weight: 900; color: #fff; font-size: clamp(21px, 3.4dvh, 28px); letter-spacing: .06em;
  text-shadow: 0 1px 2px rgba(0,0,0,.45), 0 0 14px rgba(0,0,0,.35); opacity: 0; transition: opacity .8s ease 2.9s; }
.card { flex: none; width: 100%; max-width: 520px; background: rgba(255,253,248,.88); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-radius: 22px; padding: 16px 18px 14px; text-align: left; box-shadow: 0 10px 28px rgba(40,30,20,.22);
  opacity: 0; transform: translateY(24px); transition: opacity 1s ease 3.1s, transform 1s ease 3.1s; }
.card .k { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 6px; font-weight: 700; color: var(--a); font-size: 17px; letter-spacing: .12em; }
.card p.w { margin: 0; font-weight: 500; font-size: clamp(17px, 2.75dvh, 21px); line-height: 1.85; letter-spacing: .03em; text-wrap: pretty; }
.again { font-family: var(--round); font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--sub); background: #fff; border: 1px solid #e4d8cc; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.go .chip, .go .dateline { opacity: 1; }
.go .badge { opacity: 1; transform: none; }
.go .card { opacity: 1; transform: none; }

.fall { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.fall i { position: absolute; top: -20px; width: 11px; height: 13px; border-radius: 60% 40% 60% 40%; opacity: .8; animation: drop linear forwards; box-shadow: 0 0 2px rgba(255,255,255,.6); }
@keyframes drop { to { transform: translate(var(--x), 110vh) rotate(var(--rr)); opacity: 0; } }

.preview { position: fixed; top: 6px; right: 6px; z-index: 9; background: #fff; padding: 4px 6px; border-radius: 8px; font-size: 12px; }
.preview[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) {
  #cover, #month, .start, .chip, .badge, .dateline, .card { transition-duration: .01s !important; transition-delay: 0s !important; }
  .start .t3 { animation: none; }
  .fall { display: none; }
}
</style>
</head>
<body>
<div class="layer" id="month"></div>
<div class="layer" id="cover" style="background-image:url('img/cover.jpg')"></div>
<main class="today" id="today" aria-live="polite">
  <div class="chip" id="chip"></div>
  <div class="badge"><svg viewBox="-60 -60 120 120" aria-hidden="true"><path id="scallop" fill="#fffdf8" stroke="var(--a)" stroke-width="3"/><circle r="41" fill="none" stroke="var(--b)" stroke-width="1.6" stroke-dasharray="2 4"/></svg><div class="d" id="dnum"></div></div>
  <div class="dateline" id="dateline"></div>
  <div class="card"><p class="k"><span id="klabel">今日のことば</span><button class="again" id="again" type="button">もう一度</button></p><p class="w" id="word"></p></div>
</main>
<button class="start" id="start" type="button" aria-label="タップして今日の場面へ">
  <span class="box"><span class="t1" style="display:block">今日のことば</span><span class="t2" style="display:block">日めくり　365日</span><span class="t3" style="display:block">👆 タップしてね</span></span>
</button>
<div class="fall" id="fall" aria-hidden="true"></div>
<div class="preview" id="preview" hidden><input type="date" id="pdate"></div>
<script>
const WORDS = {"1":["あけましておめでとうございます。新しい一年のはじまりに、まずは去年をがんばりぬいた自分へ「ありがとう」。その気持ちが、今年の一歩目になります。","書き初めの日。今年の自分にかけたい言葉を、ひとつ選んでみませんか。「大丈夫」「ありがとう」。やさしい言葉ほど、一年を通して心を支えてくれます。","お正月のにぎやかさに、少し疲れていませんか。人が多い場所のあとは、静かな時間で心をととのえましょう。ひとりの時間も、大切なお休みです。","日常が少しずつ戻ってくる頃ですね。急にがんばらなくて大丈夫。ゆっくり歩き出すくらいが、心にも体にもちょうどいい速さです。","小寒、寒さが本格的になる頃です。冷えると心までこわばりやすいもの。温かい飲みものを手に「今日もありがとう」と、ひと息つきましょう。","新しい年だからと、目標を決めなくても大丈夫です。「今年は自分にやさしくする」。それだけでも、十分すてきな目標になります。","七草がゆの日。お正月で疲れた胃をいたわるように、心にもやさしい一日を。「ここまでよくがんばったね」と、自分をねぎらってあげましょう。","冬の朝、吐く息が白く見えますね。その白い息をゆっくり長く吐いてみてください。息を吐くたびに、心の中のもやもやも、少しずつ外へ出ていきます。","誰かの何気ないひとことが、ずっと心に残る日もありますね。それはあなたが言葉を大切にしている証です。今日は、自分にかける言葉をやさしくしましょう。","冷たい空気の中で、冬の星はひときわ明るく見えます。つらい時期にこそ見えてくる光もある。今のあなたにも、ちゃんと光は届いています。","鏡開きの日。かたいお餅を割って、一年の幸せを願います。心のかたくなった部分も、温かい言葉で少しずつほぐしていきましょう。","寒い日に咲く寒椿は、まわりに合わせず、自分の季節にそっと咲きます。あなたにも、あなたが咲くちょうどいいタイミングがあります。","成人の日のころ。大人になってからも、心の中の小さな自分はずっといます。その子に「よく大きくなったね、ありがとう」と声をかけてあげてください。","寒いと、体がぎゅっと縮こまりますね。肩を一度すくめて、ストンと落としてみましょう。力が抜けると、心にも小さなすき間が生まれます。","小正月。お正月の締めくくりの日です。ここまでの半月、新しい年に慣れようとがんばってきた自分に、温かい「おつかれさま」を。","「疲れた」と感じたら、それは体からの大切なお知らせです。無視せずに「教えてくれてありがとう」と受けとめて、今日は早めに休みましょう。","雪の日の静けさは、音を吸いこんでくれるやさしさです。にぎやかな毎日に疲れたら、雪の静けさを思い浮かべて、心をしんと休ませましょう。","まわりのペースに合わせられない日があっても大丈夫。冬に眠る木々のように、外からは見えなくても、あなたの中ではちゃんと力がたくわえられています。","こたつやお布団のぬくもりに「ありがとう」。当たり前にあるものに感謝すると、心の中にも、じんわりと温かさが広がっていきます。","大寒、一年でいちばん寒い頃です。でも、ここを越えれば春に向かうだけ。今がいちばんつらい時期なら、あとは少しずつ楽になっていきます。","人の顔色が気になって疲れた日は、自分の顔色もたずねてあげましょう。「わたしは今、どんな気持ち？」。その問いかけが、心を守ってくれます。","寒さの中でも、水仙はまっすぐ上を向いて咲いています。下を向きたくなる日は、少しだけ顔を上げて、深呼吸をひとつ。それで十分です。","みかんの皮をむくと、さわやかな香りが広がりますね。好きな香りを味わう時間は、頭の重さや心のざわざわを、そっとやわらげてくれます。","「できない自分」を責める言葉は、心のブレーキになります。「それでもよくやってる」。今日はその言葉で、ブレーキを少しゆるめてあげましょう。","冬の日だまりを見つけたら、少しだけ立ち止まってみてください。お日さまのぬくもりを感じるだけで、心がふっと明るくなります。","梅のつぼみが、少しずつふくらみはじめています。まだ咲いていなくても、つぼみは確かに育っています。あなたの変化も、ちゃんと進んでいますよ。","寝る前に、今日の「ありがとう」をひとつ思い出してみましょう。どんなに小さなことでもかまいません。感謝で終わる一日は、眠りもやさしくなります。","感じすぎて疲れてしまうのは、あなたの心がそれだけ豊かな証です。その豊かさを守るために、今日は「疲れたら休む」を自分に許してあげましょう。","寒い日の温かいお風呂は、一日のごほうびですね。湯船の中で「今日もありがとう」とつぶやくと、体だけでなく心の芯まで温まっていきます。","新しい年も、もうすぐひと月。思ったようにできなかったことがあっても大丈夫。今日ここまで来られたことが、もう十分な一歩です。","1月の最後の日。寒さの中を過ごしてきた自分に「よくがんばったね、ありがとう」。立春ももうすぐです。春に向かって、ゆっくり歩いていきましょう。"],"2":["2月のはじまりです。寒さの中にも、日差しが少しずつ明るくなってきました。小さな変化に気づけるあなたの感性に、今日も「ありがとう」。","冬の終わりが近づくと、心も体も少し揺れやすくなります。揺れるのは、季節の変わり目を感じとっている証。無理せず、ゆっくり過ごしましょう。","節分の日。「鬼は外」は、心の中の不安や責める言葉を外へ出す合図です。「福は内」で、やさしい言葉と感謝を心の中へ招き入れましょう。","立春、暦の上では春のはじまりです。まだ寒くても、春はもう始まっています。あなたの変化も、気づかないところで、もう始まっていますよ。","梅の花が、寒さの中でほころびはじめています。満開でなくても、ひとつ咲けばそれは春のしるし。小さな「できた」を見つけて、自分をほめましょう。","人の気持ちを感じとりやすい日は、自分の気持ちを置き去りにしがちです。胸に手を当てて「わたしは今どう感じてる？」と聞いてあげましょう。","寒い朝に飲む白湯は、体の内側からじんわり温めてくれます。ひと口ずつ味わいながら「今日も目覚められてありがとう」と、一日を始めましょう。","針供養の日。がんばってくれた針をねぎらう日です。毎日働いてくれている自分の手や体にも「いつもありがとう」と声をかけてあげましょう。","「もっとがんばらなきゃ」と思った時は、少しだけ立ち止まって。もう十分がんばっている自分に気づくことも、前に進むための大切な力です。","うぐいすの初音が聞こえはじめる頃。最初はまだ上手に鳴けなくても、少しずつ声がととのっていきます。あなたも、焦らずに練習中でいいんですよ。","冬の空気は澄んでいて、遠くの景色まではっきり見えますね。心のもやが晴れない日は、遠くを眺めて深呼吸をひとつ。視界が広がると心も広がります。","誰かに優しくできた日は、その優しさを自分にも分けてあげてください。人にかける温かい言葉を、自分にもかけていいんです。","三寒四温。寒い日と暖かい日をくり返しながら、季節は春へ向かいます。心も同じで、いい日とつらい日をくり返しながら、少しずつ軽くなっていきます。","バレンタインの日。大切な人へ気持ちを伝える日です。いちばん身近な自分にも「いつもそばにいてくれてありがとう」と伝えてあげましょう。","頭が重い日、気分が晴れない日もありますね。そんな日は「今日はゆっくりでいい」と自分に許可を出しましょう。許すことは、心をゆるめる第一歩です。","雪の下で、ふきのとうが顔を出す準備をしています。見えないところで育つ時間も、大切な時間です。今のあなたの毎日も、ちゃんと春につながっています。","疲れた心には、静かな音楽や好きな香りがよく効きます。自分が「ほっとする」と感じるものを、ひとつ知っておくと、心のお守りになりますよ。","「ありがとう」は、言うほうの心も温めてくれる言葉です。今日は出会った人に、いつもより少しだけ心をこめて「ありがとう」を伝えてみましょう。","雨水、雪が雨に変わり、氷がとけはじめる頃です。かたく凍っていた心も、温かい言葉を受けとるうちに、少しずつとけていきます。","繊細さは、決して弱さではありません。春のわずかな気配に気づけるのも、人の小さな変化に気づけるのも、あなたが持っている大切な力です。","雪解けの水が、川へ流れていく季節です。ためこんだ思いも、紙に書いたり誰かに話したりして、少しずつ流してあげると心が軽くなります。","寒い夜は、温かい毛布にくるまって「今日もおつかれさま」。がんばった一日を、やさしい言葉で包んであげると、ぐっすり眠れますよ。","比べる相手は、ほかの誰かではなく、去年の今ごろの自分です。思い出してみてください。あの頃より、少しでも楽になったことはありませんか。","春一番が吹くと、季節が大きく動き出します。強い風に心がざわつく日は、地面に足をつけて深呼吸を。しっかり立っている自分を感じてみましょう。","梅の香りは、近づいた人だけにふわっと届きます。あなたのやさしさも、大きな声で伝えなくても、ちゃんとまわりの人に届いています。","うまくいかなかったことより、今日うまくいったことを思い出してみましょう。ひとつでも見つかったら、それは十分に、ほめていい一日です。","日が少しずつ長くなってきました。夕方の空がまだ明るいことに気づいたら、それも春からのプレゼント。小さな喜びに「ありがとう」を。","2月も、いよいよ終わり。寒い冬をここまで越えてきた自分に「よくがんばったね、ありがとう」。もうすぐ、やわらかな春がやってきます。","4年に一度だけの、特別な日です。いつもより一日多いこの日は、自分へのごほうびの日にしましょう。「わたしはわたしでいい」。今日はその言葉を胸に。"],"3":["3月のはじまりです。風の中に、ほんのり春の香りがまじりはじめましたね。季節が変わる気配を感じられる今日に、「ありがとう」。","春が近づくこの時期は「木の芽どき」とも呼ばれ、心も体も揺れやすくなります。調子が出ない日があっても、それは季節のせい。自分を責めないでくださいね。","ひな祭りの日。健やかな成長を願う日です。何歳になっても、あなたの心は今も少しずつ育っています。今日は自分の成長も、そっとお祝いしましょう。","桃の花のやわらかな色は、見ているだけで心がほどけていきます。今日は、自分の好きな色をひとつ身につけて、気持ちをやさしく包んであげましょう。","啓蟄、土の中で眠っていた虫たちが目を覚ます頃です。あなたの中で休んでいた気持ちも、ゆっくり目を覚ませばいい。急がなくて大丈夫です。","3月は、何かと気ぜわしい季節です。予定がつまって疲れた日は、ひとつだけ「やらなくていいこと」を決めてみましょう。心に余白が生まれます。","菜の花の黄色は、まるで小さなお日さまのよう。気分が沈む日は、明るい色の花や景色を眺めてみてください。目から入る光が、心を照らしてくれます。","人と自分の境界線は、冷たい壁ではなく、自分を守るやさしい垣根です。「ここまでは大丈夫、ここからは休む」。そう決めていいんですよ。","春の雨は、草木を育てるやさしい雨です。泣きたい日は、我慢しなくて大丈夫。涙もまた、心を育ててくれる春の雨のようなものです。","道ばたに、つくしが顔を出しはじめました。小さくても、しっかりと春を知らせています。あなたの小さな一歩も、ちゃんと未来を知らせるしるしです。","当たり前の毎日は、実はたくさんの奇跡の積み重ねです。今日もごはんを食べられること、眠れる場所があること。そのひとつひとつに「ありがとう」を。","沈丁花の甘い香りが漂う頃です。香りは、心にまっすぐ届く贈りもの。好きな香りを深く吸いこんで、ゆっくり吐く。それだけで心がととのいます。","「みんなはできているのに」と思う日もありますね。でも、花が咲く時期はそれぞれ違います。あなたにはあなたの、ちょうどいい季節があります。","ホワイトデー。いただいた気持ちにお返しをする日です。今日は、毎日がんばってくれている自分にも、小さなお返しのごほうびを用意しましょう。","3月は、別れの季節でもあります。さみしさを感じるのは、それだけ大切なつながりがあった証。その気持ちも、やさしく抱きしめてあげてください。","暖かい日と寒い日が交互にやってきます。体調がゆらぐ日は、一枚羽織るように、心にも「無理しないでね」という言葉を一枚かけてあげましょう。","誰かに言われたひとことが気になる日は、その言葉を少し遠くに置いてみましょう。今あなたが大切にしたいのは、自分にかけるやさしい言葉です。","春の日差しを浴びながら、ゆっくり歩いてみませんか。足の裏で地面を感じ、ひと足ずつ進む。歩くことは、心を落ち着かせる一番身近な方法です。","「できない」を「まだ途中」と言いかえてみましょう。それだけで、心のブレーキがひとつゆるみます。途中にいるあなたは、ちゃんと前に進んでいます。","春分、昼と夜の長さがほぼ同じになる日です。がんばる時間と休む時間も、半分ずつくらいがちょうどいい。今日はバランスを思い出す日にしましょう。","お彼岸のころ。ご先祖さまや、自分を支えてくれた人を思い出してみましょう。たくさんの「ありがとう」の先に、今のあなたがいます。","ちょうちょが、花から花へ軽やかに飛んでいます。心が重い日は、ちょうちょのように「少しだけ」動いてみる。小さな動きが、気持ちを軽くしてくれます。","疲れやすいのは、まわりの変化をたくさん受けとっているから。あなたの感じる力が豊かな証拠です。今日は受けとった分だけ、ゆっくり休みましょう。","卒業の季節です。終わりは、新しい始まりの入り口でもあります。何かを手放した時、そこには新しいものが入ってくる、すてきな空きスペースが生まれます。","今日、自分にかけた言葉を思い出してみてください。厳しい言葉ばかりだったら、ひとつだけやさしい言葉に変えてみましょう。言葉が変わると心も変わります。","桜のつぼみが、ふくらみはじめました。咲く前のつぼみも、それだけで美しいものです。完成していない今のあなたも、十分に美しいですよ。","年度の終わりが近づくと、なんとなく焦りを感じやすくなります。そんな時は「今日できたことはこれで十分」と、自分に言ってあげましょう。","春の夜は、どこかやわらかい空気に包まれています。窓を少し開けて夜風を感じながら、今日あった小さな「よかった」を数えてみましょう。","心がざわざわする日は、ゆっくり5つ数えながら息を吸い、7つ数えながら吐いてみてください。吐く息を長くすると、心は自然と落ち着いていきます。","新しい季節を前に、不安になるのは自然なことです。その不安は、あなたが一生懸命に生きようとしている証。不安ごと、自分を抱きしめてあげましょう。","3月の最後の日、年度の締めくくりです。この一年を歩いてきた自分に「本当におつかれさま、ありがとう」。明日からの春も、あなたのペースで大丈夫です。"],"4":["新しい年度のはじまりです。まわりが新しいことで動き出しても、あなたはあなたのペースで大丈夫。まずは今日を迎えられたことに「ありがとう」。","桜の花が、町をやさしい色に染めています。満開の桜を見上げる時、心はふっと軽くなりますね。今日は少しだけ、上を向いて歩いてみましょう。","新しい環境は、知らず知らずのうちに心を疲れさせます。疲れを感じるのは、それだけたくさんのことを受けとめている証。今夜はゆっくり休みましょう。","花冷えの日は、春なのに肌寒く感じます。季節も行ったり来たりするように、心が行ったり来たりするのも自然なこと。今日の自分をそのまま認めてあげましょう。","清明、すべてのものが清らかに明るく輝く頃です。窓を開けて春の空気を入れてみませんか。新しい空気といっしょに、心にも明るさが入ってきます。","初めて会う人が多い季節ですね。うまく話せなくても大丈夫。にっこりほほえむだけでも、あなたのやさしさは、ちゃんと相手に伝わっています。","桜は、散ることをこわがらずに咲いています。うまくいくかどうかより、今を精いっぱい生きること。それだけで、あなたの毎日は美しく咲いています。","花祭り、お釈迦さまの誕生をお祝いする日です。あなたが生まれてきてくれたことも、かけがえのない奇跡。今日は自分の存在に「ありがとう」を伝えましょう。","新しいことを始める時は、誰でも不安になります。不安はブレーキではなく、慎重に進むための大切なセンサーです。そっと手をつないで、一緒に進みましょう。","花吹雪が舞う道を歩くと、まるで春に祝福されているよう。今日は、あなたのまわりにある小さな「美しいもの」に気づいて、心の中で拾い集めてみましょう。","人に合わせてがんばった日は、帰り道に「今日もよくやったね」とつぶやいてみてください。その一言が、張りつめた心をやさしくほどいてくれます。","たんぽぽは、アスファルトのすき間からでも元気に咲きます。どんな場所にいても、あなたにはあなたらしく咲く力がある。それを忘れないでくださいね。","春の陽気に、眠気を感じる日もありますね。「春眠暁を覚えず」というように、春は眠くなる季節。眠いのは体が休みたいサインです。","まわりの声が大きく感じる日は、イヤホンで好きな音楽を聴いたり、静かな場所に移ったりしてみましょう。刺激を減らすのは、自分を守るやさしい工夫です。","4月も半分が過ぎました。新しい毎日に慣れようとしてきた自分を、ここで一度ほめてあげましょう。「半月よくがんばったね、ありがとう」。","散った桜の花びらも、地面をやさしく彩っています。終わったことにも、ちゃんと意味がある。過去の自分も、今のあなたを支えてくれていますよ。","つばめが南の国から帰ってくる頃です。長い旅をしても、ちゃんと帰る場所がある。あなたにとって、心が帰れる場所はどこですか。今日はそこで休みましょう。","「ちゃんとしなきゃ」と思うほど、心はかたくなってしまいます。今日は「だいたいで大丈夫」と言ってあげましょう。ゆるむと、自然と力が出てきます。","チューリップは、朝に開いて夕方に閉じます。花も一日のうちに休んでいるんですね。がんばる時間のあとには、閉じて休む時間も大切にしましょう。","穀雨、春の雨が穀物を育てる頃です。しとしと降る雨の音に耳をすませてみてください。やさしい雨音は、ざわついた心を静かになでてくれます。","桜が散って、若葉が芽吹いてきました。花の時期が終わっても、木は次の季節に向けて育ち続けます。あなたも、毎日ちゃんと育っていますよ。","誰かの期待にこたえようとして疲れた日は、自分の期待にもこたえてあげましょう。「今日はゆっくりしたい」。その願いをかなえてあげるのも大切です。","春の夕暮れは、空がやわらかな色に染まりますね。一日の終わりに空を眺めて、今日あった小さな「ありがとう」を、ひとつ思い出してみましょう。","頭が重い日は、首や肩をゆっくり回してみてください。こわばった体がほぐれると、心も少しずつほどけていきます。体と心は、いつもつながっています。","「わたしなんて」と思いそうになったら、「わたしだから」と言いかえてみましょう。あなたにしかできないことが、この世界にはちゃんとあります。","藤の花が、紫色のしずくのように垂れて咲きはじめます。ゆったり揺れる藤のように、今日は肩の力を抜いて、風に身をまかせるように過ごしましょう。","新しい人間関係に疲れたら、距離をとってもいいんです。近すぎず遠すぎず、心地よい距離は人それぞれ。あなたにとってのちょうどいい距離を大切にしましょう。","若葉の緑は、目を休めてくれる色です。疲れた日は、木々の緑を眺めたり、観葉植物にふれたりしてみましょう。緑の力が、心をそっと癒してくれます。","昭和の日のころ。昔の写真や思い出の品を見返すと、たくさんの人に支えられてきたことに気づきます。その一人ひとりに、心の中で「ありがとう」を。","4月の最後の日。新しい季節の中を、ひと月がんばってきた自分に「本当によくやったね、ありがとう」。明日からは、ほっとひと息つける日も作りましょう。"],"5":["5月のはじまりです。木々の緑がまぶしい季節になりましたね。新しい葉が毎日少しずつ広がるように、あなたの心も、ゆっくり広がっていきます。","八十八夜のころ。新茶の季節です。温かいお茶をゆっくりいれて、湯気と香りを味わってみませんか。ていねいにいれた一杯は、心までほどいてくれます。","お休みの日は「何かしなきゃ」と思わなくて大丈夫です。何もしない時間も、心と体にとっては大切な栄養。今日はのんびりする自分を許してあげましょう。","みどりの日。木々の緑にふれてみましょう。葉っぱの手ざわりや、土のにおい。自然を感じる時間は、張りつめた心をやさしくゆるめてくれます。","こどもの日。鯉のぼりのように、あなたの中の小さな自分ものびのびと泳がせてあげましょう。夜は菖蒲湯で、一日の疲れを流してくださいね。","立夏、暦の上では夏のはじまりです。季節が変わる時は、心も体も少し揺れやすくなります。揺れを感じたら、深呼吸をして「大丈夫」とつぶやきましょう。","お休み明けは、心が重く感じやすいものです。いきなり全力で戻らなくても大丈夫。今日は「行けた」「できた」だけで、十分に花まるです。","五月晴れの空は、どこまでも青く広がっています。悩みで頭がいっぱいの日は、空の広さを思い出して。あなたの悩みも、この空の下ではちゃんと小さくなれます。","疲れているのに、つい笑顔でがんばってしまう日もありますね。今日は誰にも見せなくていい、自分だけの「ほっとする顔」で過ごす時間を作りましょう。","母の日のころ。お母さんや、母のように支えてくれた人を思い出してみましょう。そして、毎日自分を育て続けている自分自身にも「ありがとう」を。","新緑の中を吹きぬける風を「薫風」と呼びます。若葉の香りをのせたやさしい風です。窓を開けて、その風を胸いっぱいに吸いこんでみてください。","「五月病」という言葉があるように、この時期に気持ちが沈むのは珍しいことではありません。あなたのせいではないので、どうか自分を責めないでくださいね。","たけのこは、一日でぐんと伸びることがあります。でもその前に、土の中で長い時間をかけて根を張っています。今のあなたも、根を張る大切な時間の中にいます。","誰かのひとことでチクッと傷ついた日は、その言葉を「預かりもの」として、そっと横に置きましょう。受けとるかどうかは、あなたが決めていいんです。","5月も半分が過ぎました。ここまでの毎日の中で、うれしかったことをひとつ思い出してみましょう。どんなに小さなことでも、それはあなたの宝物です。","ばらの花が、色とりどりに咲きはじめる頃です。ばらにとげがあるように、繊細なあなたにも自分を守る力があります。その力を大切にしてくださいね。","頭が重い日は、目を閉じて、手のひらで目のまわりをそっと包んでみてください。手のぬくもりが、こわばった頭と心を、じんわり休ませてくれます。","「ありがとう」を言われた時は、「いえいえ」ではなく「こちらこそ、ありがとう」と返してみましょう。感謝が行き来すると、心がふわっと温かくなります。","緑の中を歩くと、それだけで心が落ち着いてきます。近くの公園や並木道でもかまいません。今日は5分だけ、緑の中で深呼吸する時間を作りましょう。","人と比べて落ちこむ日は、自分の「好き」に目を向けてみましょう。好きなことをしている時のあなたは、誰とも比べられない、あなただけの輝きを持っています。","小満、草木が育ち、満ちあふれていく頃です。今の自分に足りないものより、もうすでに持っているものを数えてみましょう。心が少しずつ満ちていきます。","田植えが始まり、水を張った田んぼに空が映っています。静かな水面のように、心も波が落ち着くと、まわりの景色がきれいに映るようになります。","疲れた日は、早めにお布団に入りましょう。眠りは、心と体をととのえるいちばんの方法です。「今日もよくがんばったね」と言って、目を閉じてください。","「わたしはわたしのままでいい」。今日はこの言葉を、何度か心の中でくり返してみましょう。くり返すうちに、言葉が心にしみこんでいきます。","日差しが強くなってきましたね。帽子や日傘で体を守るように、心にも休む時間という日かげを作ってあげましょう。守ることは、弱さではありません。","一度にたくさんのことを考えると、頭がいっぱいになってしまいます。やることを紙に書き出して、ひとつずつ。目の前のひとつに集中すれば大丈夫です。","若葉が少しずつ濃い緑に変わってきました。季節がゆっくり深まるように、あなたのやさしさも、日々の中でゆっくり深まっています。","今日、誰かのやさしさにふれた瞬間はありましたか。小さな親切に気づける心は、それだけで豊かです。その気づきに「ありがとう」を伝えましょう。","心のブレーキは、自分を守るためにかかっていることもあります。無理にはずそうとせず「守ってくれてありがとう」と声をかけると、そっとゆるんでいきます。","そろそろ梅雨の気配が近づいてきます。天気が変わる前は、体調がゆらぎやすいもの。今のうちに、ゆっくり休める時間を予定に入れておきましょう。","5月の最後の日。緑あふれる季節の中を過ごしてきた自分に「おつかれさま、ありがとう」。明日からの6月も、あなたのペースで歩いていきましょう。"],"6":["衣替えの日。重たい服を軽い服にかえるように、心にためこんだ重い荷物も、ひとつ下ろしてみませんか。身軽になると、深く息ができるようになります。","6月のはじまりです。雨の季節がやってきます。しっとりした空気の中では、心も静かに落ち着きやすいもの。ゆっくり過ごすのにぴったりの季節ですね。","紫陽花は、雨にぬれるほど色があざやかになります。つらい経験をした分だけ、あなたのやさしさも深い色になっていきます。","天気がくずれる前は、頭が重くなったり、だるくなったりしやすいもの。それは体が変化を感じとっている証です。「教えてくれてありがとう」と受けとめて休みましょう。","芒種、田植えや種まきに良い頃です。今日、自分の心にやさしい言葉の種をひとつまいてみましょう。「わたしは大丈夫」。毎日の水やりで、ちゃんと育ちます。","雨の日は、外に出なくてもいい理由をくれる日です。家の中で好きな音楽を聴いたり、本を読んだり。自分のための静かな時間を楽しみましょう。","かたつむりは、自分の家を背負って、ゆっくりゆっくり進みます。速く進めなくても大丈夫。あなたのペースで、ちゃんと前に進んでいますよ。","雨音に耳をすませてみてください。ぽつぽつ、しとしと。一定のリズムで続く雨音は、ざわついた心をそっとなでて、静かにしてくれます。","誰かの機嫌が気になってしまう日は、「それはその人の天気」と考えてみましょう。人の空模様は、あなたのせいではありません。自分の心の天気を大切に。","時の記念日。時間を大切にする日です。誰かのための時間だけでなく、自分をいたわるための時間も、同じくらい大切な時間ですよ。","入梅、梅雨入りの頃です。じめじめした日が続くと、気持ちも沈みがち。そんな日は「今日は省エネの日」と決めて、がんばりすぎないでいきましょう。","雨の日に家の中でできる、小さな楽しみを見つけてみませんか。温かいお茶、ふかふかのクッション、好きな香り。小さな心地よさが、心を支えてくれます。","「迷惑をかけたくない」と、ひとりで抱えこんでいませんか。誰かに頼ることは、相手に「あなたを信じています」と伝えることでもあるんですよ。","青梅が実り、梅仕事の季節です。梅は、時間をかけてゆっくり漬けるほど、まろやかな味になります。焦らずに過ごす時間が、あなたをやさしく熟させてくれます。","6月も半分が過ぎました。雨の多い毎日を過ごしてきた自分に「よくがんばってるね」。曇りの日が続いても、雲の上にはいつも青空が広がっています。","父の日のころ。お父さんや、父のように見守ってくれた人を思い出してみましょう。ひとことの「ありがとう」が、伝える人の心も温めてくれます。","ほたるの光は、小さくてもやさしく夜を照らします。目立たなくても、あなたの存在は、まわりの誰かの心をそっと照らしていますよ。","湿気の多い日は、体も心も重く感じやすいもの。首のうしろを温めたり、ゆっくりお風呂につかったりして、体をいたわってあげましょう。","「あの時こう言えばよかった」と思い返してしまう夜は、「あの時の自分も精いっぱいだった」と言ってあげてください。過去の自分にも、やさしさを。","雨上がりの虹を見つけたら、少しだけ足を止めてみましょう。雨が降ったからこそ、虹は見えます。つらい日のあとにも、必ずやさしい光がさします。","夏至、一年でいちばん昼が長い日です。たっぷりの光をあびて、体の中にお日さまのエネルギーを取り入れましょう。今日の明るさに「ありがとう」。","頭や体の不調を感じる日は、「治さなきゃ」と焦るより「今日もよく耐えてくれたね」とねぎらってあげましょう。やさしい言葉は、体にもちゃんと届きます。","くちなしの花が、甘い香りを漂わせています。香りは、言葉を使わずに心をほぐしてくれる魔法です。好きな香りで、今日の自分を包んであげましょう。","自分の気持ちを言葉にするのが苦手な日は、ノートに書いてみましょう。上手に書かなくて大丈夫。書くだけで、心の中が少しずつ整理されていきます。","てるてる坊主に願いをこめるように、明日の自分に願いをひとつ。「明日の自分が、少しでも笑えますように」。その願いが、心をそっと前に向けてくれます。","雨にぬれた緑は、いつもよりみずみずしく輝いて見えます。泣いたあとの心も、同じように澄んでいます。涙は、心を洗ってくれるやさしい雨です。","まわりの刺激に疲れたら、目を閉じて、雨の音や自分の呼吸だけを感じてみましょう。外の世界から少し離れる時間が、心のエネルギーを取り戻してくれます。","「ありがとう」を一日に何回言えたか、数えてみませんか。数えるうちに、毎日の中にこんなに感謝があったんだと、気づかせてくれます。","梅雨の晴れ間は、いつも以上にありがたく感じますね。当たり前の青空にも感謝できる心は、毎日を豊かにしてくれる、あなたの大切な宝物です。","夏越の祓、一年の前半の締めくくりの日です。半年分の疲れやもやもやをそっと手放して、「ここまでよくがんばったね、ありがとう」と自分に伝えましょう。"],"7":["7月のはじまりです。一年の後半が始まりましたね。前半をがんばってきた自分に「ありがとう」を伝えてから、ゆっくり新しい半年へ歩き出しましょう。","半夏生のころ。昔から、田植えを終えて体を休める目安の日でした。がんばったあとは、しっかり休む。それは、昔の人が大切にしてきた知恵なんですね。","朝顔は、朝早くに花を開き、昼にはそっと閉じます。一日の中で、元気な時間と休む時間があっていい。あなたも、自分のリズムを大切にしましょう。","蒸し暑い日は、それだけで体力を使っています。何もしていないように思えても、暑さの中で過ごしているだけで、あなたは十分がんばっていますよ。","風鈴の音が、涼しい風を知らせてくれます。チリンという小さな音に耳をすませると、それだけで心がすっと静かになります。小さな音を楽しんでみましょう。","七夕の前の日。明日、短冊に書く願いごとを考えてみませんか。誰かのための願いだけでなく、自分の心が楽になる願いも、ちゃんと書いていいんですよ。","七夕の日。年に一度、星に願いをかける夜です。「わたしがわたしらしく笑えますように」。あなたの願いは、きっと夜空に届いています。","小暑、本格的な暑さが始まる頃です。暑さで心までぐったりする日は、冷たいタオルで首すじを冷やしてみましょう。体が楽になると、心もふっと軽くなります。","ほおずきの実は、小さな提灯のようですね。心の中にも、小さな明かりをひとつ灯しましょう。「今日もありがとう」。その言葉が、やさしい明かりになります。","まわりのにぎやかさに疲れたら、そっとその場を離れてもいいんです。静かな場所で深呼吸をひとつ。あなたの心を守るのは、あなた自身の大切な役目です。","冷房のきいた部屋と外の暑さの行き来で、体は思った以上に疲れています。温かい飲みものをひと口。体の内側から、やさしくととのえていきましょう。","夏の朝は、早い時間がいちばん涼しくて気持ちいいですね。少しだけ早起きして、朝の空気を吸いこんでみましょう。静かな朝は、一日を穏やかにしてくれます。","お盆の入り。ご先祖さまをお迎えする日です。今のあなたがいるのは、たくさんの命がつながってきたから。その一人ひとりに、心の中で「ありがとう」を。","「ちゃんとしなきゃ」と思いすぎて疲れていませんか。夏は、少しだらっとするくらいでちょうどいい季節です。今日は肩の力を抜いて過ごしましょう。","7月も半分が過ぎました。暑さの中をここまで過ごしてきた自分に「よくがんばってるね」。小さな疲れも、早めにいたわってあげることが大切です。","送り火の日。ご先祖さまを見送る日です。手放すことは、さよならではなく感謝の形。心の中のもやもやも、今日は「ありがとう」と言って送り出しましょう。","海の日のころ。寄せては返す波の音を思い浮かべてみてください。波のリズムに合わせてゆっくり呼吸すると、心は自然と落ち着いていきます。","梅雨明けの青空は、気持ちまで晴れやかにしてくれますね。長い雨の季節を越えてきた自分にも「おつかれさま、ありがとう」と伝えてあげましょう。","入道雲が、空にもくもくと大きく広がっています。大きな雲も、形を変えながら流れていきます。今の悩みも、いつか形を変えて流れていきますよ。","夏休みが始まる頃。にぎやかになる季節ですが、自分だけの「静かなお休み時間」も大切に。一日のうち少しでも、ひとりでほっとできる時間を作りましょう。","夕立のあとは、空気がすっと涼しくなりますね。泣いたあとの心がすっきりするのと同じです。泣きたい時は、我慢せずに心の夕立を降らせてあげましょう。","大暑、一年でいちばん暑い頃です。暑さに負けそうな日は、こまめにお水を飲んで、日かげで休みましょう。自分の体をいたわることも、大切な感謝の形です。","暑い日に食べるかき氷は、ひと口ごとに体をすっと冷やしてくれますね。ゆっくり味わいながら「おいしいね、ありがとう」。小さな幸せを大切にしましょう。","人の言葉に心がざわついた日は、「わたしはどうしたい？」と自分に聞いてみましょう。答えはいつも、あなたの心の中にあります。","蝉の声は、短い夏を精いっぱい生きている証です。うまくいかない日も、精いっぱい生きているあなたは、それだけで十分にすばらしいんですよ。","土用の丑の日のころ。昔から、夏の疲れが出やすい時期とされてきました。栄養のあるものを食べて、しっかり眠る。それだけで心も体も元気になります。","夏祭りのにぎやかさが苦手でも大丈夫。遠くから聞こえるお囃子を楽しむのも、ひとつの夏の楽しみ方です。あなたに合った楽しみ方を大切にしましょう。","夜空に咲く花火は、一瞬で消えても、心にずっと残ります。今日うれしかったことも、小さくても、ちゃんと心の中に残っていきます。","冷えたすいかを家族や大切な人と分け合うと、うれしさも分け合えますね。ひとりの時は、自分に「どうぞ」と分けてあげましょう。自分にもやさしく。","暑さで眠りが浅い夜は、無理に眠ろうとしなくて大丈夫。目を閉じて横になるだけでも、体は休まっています。「休めてるよ」と自分に言ってあげましょう。","7月の最後の日。暑さの中を一か月過ごしてきた自分に「本当によくがんばったね、ありがとう」。8月も、あなたのペースで夏を過ごしていきましょう。"],"8":["8月のはじまりです。まぶしい日差しの中、ひまわりがお日さまに向かって咲いています。今日は、あなたの心が明るくなるほうへ、少しだけ顔を向けてみましょう。","暑さが続くと、何もしたくない日もありますね。それは怠けではなく、体が「休んで」と伝えてくれているサイン。その声を大切にしてあげましょう。","夕方に打ち水をすると、まわりの空気がすっと涼しくなります。心がカッと熱くなった時も、深呼吸をひとつ。心の打ち水で、気持ちがすっと落ち着きます。","夏の青空は、どこまでも高く広がっていますね。考えごとで頭がいっぱいの日は、空を見上げてみてください。大きな空が、心に余白を作ってくれます。","汗をかいた日は、こまめにお水を飲みましょう。のどがかわく前に、ひと口ずつ。自分の体を気づかうことは、自分への一番身近な「ありがとう」です。","誰かにやさしくしたいと思える心は、とても美しいものです。でも、自分の心が空っぽの時は、まず自分を満たしてあげて。それからでも遅くありませんよ。","立秋、暦の上では秋のはじまりです。まだ暑くても、季節はちゃんと次へ進んでいます。つらい時も同じ。目には見えなくても、変化は始まっています。","残暑見舞いを送るように、自分の心にもお見舞いの言葉を送りましょう。「暑い中、毎日よくがんばってるね」。ねぎらいの言葉は、心の元気のもとになります。","ひまわりは、たくさんの小さな花が集まって、一つの大きな花になっています。小さな「ありがとう」を集めていくと、心にも大きな花が咲きますよ。","まわりの音や光が強く感じる日は、部屋を少し暗くして、目を閉じて休みましょう。刺激を減らす時間は、感じやすいあなたにとって大切な充電の時間です。","山の日。山の緑や川のせせらぎを思い浮かべてみてください。自然の景色を心に描くだけでも、呼吸がゆったりして、心が落ち着いていきます。","夏の夜空には、流れ星が見えることもあります。見つけられなくても、星はいつも空にあります。あなたを見守るやさしさも、いつもそばにありますよ。","月遅れのお盆の入り。帰省や来客で、にぎやかになる時期ですね。人と過ごす時間の合間に、ひとりで深呼吸する時間も、そっと作っておきましょう。","盆踊りの輪は、誰でも入れて、いつ抜けてもいいもの。人の輪も同じです。入りたい時に入り、疲れたら抜けていい。自分のペースを大切にしましょう。","今日は、平和を願う日です。穏やかに過ごせる毎日は、決して当たり前ではありません。大切な人と笑い合えるひとときに、心をこめて「ありがとう」を。","送り火の日。ご先祖さまを見送る日です。つないでもらった命のバトンに感謝して「わたしは、わたしの人生をていねいに生きていきます」と伝えましょう。","線香花火は、小さな火花がパチパチと、静かに長く光ります。大きな花火のように目立たなくても、静かに輝くものの美しさがありますね。あなたもそうです。","夕暮れどきに、ひぐらしの「カナカナ」という声が聞こえはじめました。夏の終わりを知らせるその声に、過ぎていく季節への感謝を重ねてみましょう。","夏の疲れが出やすい時期です。体がだるい日は、無理に元気を出さなくて大丈夫。「今日はゆっくりモード」と決めて、自分をいたわりましょう。","誰かに言われた言葉より、あなたが自分にかける言葉のほうが、ずっと心に響きます。だからこそ、今日はいちばんやさしい言葉を自分に選んであげましょう。","夕涼みの時間、外に出て夜風を感じてみませんか。昼間の熱がすっと引いていくように、心の中の熱も、やさしい風がゆっくり冷ましてくれます。","夏の終わりは、なんとなくさみしい気持ちになりやすいもの。そのさみしさは、楽しかった時間があった証です。その気持ちごと、大切にしてあげましょう。","処暑、暑さがやわらぎはじめる頃です。朝晩に少しだけ涼しさを感じたら、季節からの「もうすぐだよ」というお知らせ。もう少しで、ほっとできる季節です。","夜になると、草むらから虫の声が聞こえてきますね。リーン、リーンというやさしい音色に耳をすませて、今日も一日、よく過ごせたことに「ありがとう」。","人に合わせすぎて疲れた日は、「NO」と言えなかった自分を責めないでください。それは相手を大切にしようとした、あなたのやさしさです。","暑さで食欲が落ちる日は、食べやすいものを少しずつで大丈夫。冷たいものばかりでなく、温かいスープなどで、体の内側をいたわってあげましょう。","夏休みの思い出をひとつ思い出してみましょう。どんなに小さなことでもかまいません。楽しかった記憶は、これからのあなたを支えてくれる宝物です。","頭が重い日は、こめかみをやさしく指でなでてみてください。「いつもありがとう」と声をかけながら。体にかけるやさしい言葉は、心もほぐしてくれます。","夏の終わりに、少しずつ秋の準備を始めましょう。急に変えなくても大丈夫。季節がゆっくり移るように、あなたもゆっくり次の季節へ向かえばいいんです。","新しい月が近づくと、不安になる人も多い時期です。不安を感じるのは、あなたがまじめに向き合おうとしている証。その気持ちを、そっと抱きしめましょう。","8月の最後の日。暑い夏を最後まで過ごしてきた自分に「本当によくがんばったね、ありがとう」。明日から始まる9月も、無理をせず、一歩ずつで大丈夫です。"],"9":["9月のはじまりです。夏の名残りと秋の気配が、まじり合う季節ですね。暑さの中をがんばってきた体に「ありがとう」を伝えて、新しい月を始めましょう。","夏の疲れは、少し遅れて出てくるものです。なんとなく体が重い日は、夏をがんばった証。今日は早めにお風呂に入って、ゆっくり休みましょう。","朝晩の空気が、少しずつやわらかくなってきました。窓を開けて、季節の変わるにおいを感じてみましょう。小さな変化に気づけるのは、あなたの才能です。","新学期や仕事のペースが戻ると、心が追いつかない日もありますね。体が先に動いても、心はあとからゆっくり追いついてくれます。焦らなくて大丈夫です。","台風の季節は、気圧の変化で頭が重くなったり、気分が落ちこんだりしやすいもの。それはあなたのせいではありません。天気の日は、自分にやさしくしましょう。","夜になると、虫の声がにぎやかになってきました。いろいろな音色が重なって、ひとつの音楽になっています。いろんな人がいて、いろんな感じ方があっていい。","白露、草花に朝露がつきはじめる頃です。朝露がきらきら光るように、なにげない毎日の中にも、小さな輝きがたくさんかくれています。","「どうしてわたしはこんなに気にしてしまうんだろう」と思う日もありますね。気にしてしまうのは、それだけ丁寧に生きている証。その丁寧さを、自分にも向けて。","重陽の節句、菊の節句とも呼ばれる日です。長寿を願う菊のように、自分の心と体を長く大切にしていきましょう。今日は自分の健やかさに「ありがとう」。","すすきが風にゆれる姿は、どこかやさしく見えますね。強い風に逆らわず、しなやかにゆれる。つらい時は、ゆれる自分を許してあげてもいいんですよ。","秋の長雨が続くと、気持ちも沈みがちです。そんな日は、雨音を聞きながら、温かい飲みものでほっとひと息。雨の日は、心を休めるためのお休みの日です。","人に頼まれると、つい引き受けてしまうこともありますね。「少し考えさせてね」と言うのも、自分を大切にするひとつの方法。すぐに答えなくていいんです。","夜空の月が、日に日にまるくなっていきます。月が満ちていくように、あなたの心も、毎日の小さな感謝で少しずつ満ちていきます。","新米の季節ですね。炊きたてのごはんの湯気と香りは、心まで温めてくれます。「いただきます」と「ごちそうさま」に、今日は心をこめてみましょう。","9月も半分が過ぎました。季節の変わり目を、ここまで歩いてきた自分に「よくやってるね」。ゆらぎやすい時期だからこそ、ほめる言葉を多めにしましょう。","十五夜のころ。まんまるの月を見上げてみませんか。月は、雲にかくれていても、いつも空にあります。見えない日も、あなたの光はなくなっていませんよ。","誰かと比べて焦る気持ちが出てきたら、空の月を思い出してください。月は満ちたり欠けたりしながら、いつも自分のリズムで輝いています。","敬老の日のころ。おじいちゃん、おばあちゃん、人生の先輩たちを思い出してみましょう。たくさんの人の知恵と愛情に支えられて、今のあなたがいます。","頭が重い日は、ぬるめのお風呂にゆっくりつかってみましょう。体が温まると、こわばっていた首や肩がゆるみ、心もやわらかくほどけていきます。","秋の七草は、どれも派手ではないけれど、やさしく美しい花ばかり。目立たなくても、あなたのやさしさは、ちゃんとまわりの人を和ませていますよ。","赤い彼岸花が咲きはじめました。季節を忘れず、毎年同じころに咲く花です。どんな時も、自分らしさを忘れずにいられたら、それで十分なんです。","「あの人にどう思われたかな」と気になる日は、「わたしは精いっぱいやった」と自分に言ってあげましょう。人の心は、あなたが決められなくていいんです。","秋分、昼と夜の長さがほぼ同じになる日です。お彼岸のこの時期は、ご先祖さまに感謝を伝える日。いのちをつないでくれた人たちに「ありがとう」を。","ぶどうの実は、ひと粒ひと粒が集まって、ひとふさになります。毎日の小さな「ありがとう」も、集まるときっと大きな実りになっていきますよ。","心がざわざわする日は、手を胸にあてて、ゆっくり3回呼吸をしてみましょう。手のぬくもりと呼吸を感じるだけで、心は少しずつ落ち着いていきます。","秋の夜長は、自分と向き合うのにぴったりの時間です。好きな本を読んだり、日記を書いたり。静かな夜を、自分のための時間にしてみませんか。","甘くてみずみずしい梨は、夏の太陽をたっぷり浴びて育ちました。今まで経験してきたことが、あなたの中で、やさしい甘さとして実っていきます。","「わたしは弱い」と思った時は、「わたしは繊細」と言いかえてみましょう。言葉を変えると、自分を見る目も、ふっとやさしくなっていきます。","金木犀の甘い香りが、どこからともなく漂ってくる頃です。ふと香りに気づいた瞬間、心がほどけますね。今日は、そんな小さな幸せを探してみましょう。","9月の最後の日。夏から秋へ、ゆらぎやすい季節を過ごしてきた自分に「よくがんばったね、ありがとう」。実りの10月も、あなたのペースで歩きましょう。"],"10":["10月のはじまり、衣替えの日です。夏の服をしまいながら、夏をがんばった自分に「ありがとう」。秋の服のように、心にもやわらかな温もりをまといましょう。","神無月は、神さまが出雲に集まり、留守になる月といわれます。誰も見ていないと思う時こそ、自分で自分をいちばんに見守ってあげましょう。","秋晴れの空は、高く澄みわたっていますね。空気がきれいな日は、ゆっくり深呼吸をしてみましょう。澄んだ空気が、心の中まできれいにしてくれます。","コスモスは、細い茎でも、風にゆられながら元気に咲いています。弱そうに見えても、しなやかな強さがある。繊細なあなたにも、同じ強さがありますよ。","夕焼けが、空をあたたかなオレンジ色に染める季節です。一日の終わりに空を見上げて、今日がんばった自分に「おつかれさま」と言ってあげましょう。","気温の差が大きい季節は、体が知らないうちに疲れています。だるさを感じたら、それは体ががんばって調整してくれている証。たっぷり眠って休ませましょう。","赤とんぼが、すいすいと空を泳いでいます。とんぼは前にしか進まないことから「勝ち虫」と呼ばれてきました。ゆっくりでも、前を向いていれば大丈夫です。","寒露、草木に冷たい露がおりる頃です。朝晩の冷えを感じたら、温かい靴下を一枚。体を温めることは、心をやさしく守ることにつながっています。","黄金色の稲穂が、頭をたれて実っています。実るほど頭をたれるように、感謝の気持ちを大切にする人ほど、心は豊かに実っていきます。","読書の秋。好きな本の世界にひたる時間は、心のお休み時間です。忙しい毎日の中で、ほんの数ページでも、自分のためだけの時間を作ってみましょう。","誰かのペースに合わせて疲れた日は、ひとりでゆっくり散歩してみませんか。自分の足音のリズムを感じながら歩くと、自分のペースが戻ってきます。","スポーツの日のころ。体を動かすのは、激しい運動でなくても大丈夫です。背のびをしたり、肩を回したり。体がほぐれると、心も軽くなっていきます。","栗のいがは、トゲトゲしていても、中にはやさしい甘さの実が入っています。トゲが出てしまう日も、あなたの中のやさしさはちゃんと守られていますよ。","やることが終わらない日は、「今日はここまでで十分」と区切りをつけてあげましょう。終わりを自分で決めることも、心を守るための上手な工夫です。","10月も半分が過ぎました。秋の深まりとともに、心もしっとり落ち着いてくる頃です。ここまでの半月を過ごした自分に、やさしく「ありがとう」を。","いわし雲が、空いっぱいに広がっています。小さな雲が集まって、大きな模様を作っている。あなたの小さな毎日も、集まると美しい人生の模様になります。","人に気をつかいすぎて疲れた日は、自分にも同じように気をつかってあげましょう。「疲れてない？」「何か飲む？」。自分への気づかいも、立派なやさしさです。","森では、きのこが顔を出す季節です。きのこは、雨のあとにぐんと育ちます。つらい雨の日を越えたあなたにも、育つ力がちゃんと備わっています。","頭が重い日は、温かい蒸しタオルを目元にのせてみましょう。じんわりした温かさが、こわばった目と頭をゆるめて、心までほっとさせてくれます。","どんぐりが、ころころと地面に落ちています。小さなどんぐりも、いつか大きな木に育ちます。今日の小さな一歩も、未来のあなたを育てています。","十三夜のころ。十五夜のあとに見る、少し欠けた月です。完全にまるくなくても、美しいと愛されてきました。完璧じゃない自分も、そのままで美しいですよ。","木々の葉が、少しずつ色づきはじめました。一度に変わるのではなく、少しずつ。あなたの変化も、毎日少しずつ。気づいた時には、きっと色づいています。","霜降、霜がおりはじめる頃です。冷えこむ朝は、お布団の中で「今日もありがとう」とつぶやいてから起きてみましょう。一日の始まりが温かくなります。","人の顔色をうかがってしまうのは、相手を思いやる力が強いから。その力を、今日は自分に向けてみましょう。「わたしは今、どうしてほしい？」","実りの秋は、春から夏にかけてのがんばりが形になる季節です。目に見える成果がなくても、あなたの中ではちゃんと実りが育っていますよ。","夜が長くなってきましたね。早めに部屋の明かりを落として、ゆっくり過ごしてみましょう。静かな夜の時間が、感じやすい心をそっと休ませてくれます。","「自分を変えなきゃ」と思わなくても大丈夫です。あなたを変えるのは、自分を責める言葉ではなく、自分を認めるやさしい言葉。今日は自分を認めてあげましょう。","秋の風が、落ち葉をくるくると運んでいきます。心にたまった小さなもやもやも、風にのせるように、ふっと息を吐いて手放してしまいましょう。","温かいスープがおいしい季節になりました。ひと口ずつ味わいながら、体の中から温まっていく感覚を感じてみましょう。小さな幸せに「ありがとう」。","明日はハロウィン。仮装のように、いつもとちがう自分になってみるのも楽しいもの。でも、仮面をはずした素顔のあなたこそ、いちばんすてきですよ。","10月の最後の日。実りの秋を過ごしてきた自分に「よくがんばったね、ありがとう」。いよいよ紅葉の11月。季節の色を楽しみながら、ゆっくり歩きましょう。"],"11":["11月のはじまりです。木々が少しずつ色を変えるように、わたしたちも急がず、ゆっくり変わっていけばいい。今日も目が覚めたことに、ありがとう。","朝の空気がひんやりしてきましたね。冷たさにすぐ気づける敏感さは、季節の移ろいを誰よりも深く味わえる、あなたの力でもあります。","文化の日。好きなことに触れる時間は、心の栄養です。今日はほんの少しでいいので、自分が「いいな」と感じるものに会いにいきましょう。","落ち葉を踏む音に、耳をすませてみてください。カサッという小さな音が、頭の中のざわざわを、そっと静かにしてくれます。","疲れたら休む。それは弱さではなく、自分を大切にする知恵です。今日は「よく頑張ってるね」と、自分に声をかけてあげましょう。","温かいお茶を両手で包んでみてください。手のひらに伝わるぬくもりに「ありがとう」。それだけで、肩の力がふっと抜けていきます。","立冬、冬のはじまりです。木々が葉を落として春に備えるように、わたしたちにも手放していいものがあります。抱えすぎた荷物を、少し下ろしましょう。","日が暮れるのが早くなりました。夜が長いのは「ゆっくり休んでいいよ」という季節からの合図。今夜は早めに灯りを落としてみませんか。","人の気持ちを感じとりすぎて疲れた日は、「それはわたしの荷物じゃない」と心の中でつぶやいてみてください。優しさは、自分を守ってこそ続きます。","紅葉が美しいのは、葉が最後の日まで一生懸命に生きた証です。うまくいかない日も含めて、今のあなたの毎日も、ちゃんと色づいています。","1が並ぶ日です。「ありがとう」をひとつ、声に出して言ってみましょう。最初のひとことが、一日の流れをやさしく変えてくれます。","頭や体が重い日は、無理に前向きにならなくて大丈夫。「今日はこれでいい」。そのひとことが、こわばった心をゆっくりゆるめてくれます。","木枯らしの音に、心がざわつく日もありますね。そんな時は、ゆっくり息を吐いてみて。吐く息が長いほど、心は落ち着いていきます。","誰かと比べそうになったら、昨日の自分と比べてみましょう。ほんの少しでも進んでいたら、それはもう、立派な一歩です。","七五三の日。子どもの成長を願う日です。あなたの中にいる小さな自分にも「ここまでよく育ってきたね」と伝えてあげてください。","柿が甘く実るのは、夏の暑さや秋の雨を越えてきたからこそ。つらかった日々も、いつかあなたのやさしさに変わっていきます。","「すみません」を「ありがとう」に言いかえてみませんか。同じ場面でも、言葉が変わるだけで、心の温度が少し上がります。","ひとりで静かに過ごしたい気持ちは、わがままではありません。心の充電時間です。今日は自分のための静けさを、少しだけ予約しましょう。","焼き芋のほくほくした甘さのように、ゆっくり時間をかけたものほど、やさしい味になります。あなたも、焦らなくていいんですよ。","寝る前に、今日うれしかったことを3つ思い出してみてください。小さなことで大丈夫。感謝で一日を閉じると、明日の朝がやわらかくなります。","冬支度をはじめる頃。温かい靴下や毛布をそろえるように、心にも「わたしは大丈夫」という温かい言葉を、一枚かけてあげましょう。","小雪（しょうせつ）。山に初雪が降りはじめる頃です。雪が音を吸いこむように、今日はまわりの音を少し減らして、心を休ませてあげましょう。","勤労感謝の日。誰かのためだけでなく、毎日がんばっている自分の体と心にも「いつもありがとう」。あなたも、感謝されていい大切なひとりです。","気持ちが沈んだ日は、空を見上げてみてください。晩秋の空は高く澄んでいます。広い空の下では、悩みも少し小さく見えてきます。","感じやすいあなたは、人の痛みにもすぐ気づける人です。その繊細さは弱点ではありません。いつか誰かの心を照らす、あたたかな光になります。","イチョウの葉が、道を黄色く染めています。うつむいた時こそ、足もとの小さな美しさに気づけるもの。今日は小さな宝物を探してみましょう。","「できなかったこと」より「できたこと」を数えてみましょう。顔を洗った、ごはんを食べた。それだけでも、今日のあなたは十分がんばっています。","鍋がおいしい季節です。誰かと湯気を囲んで温まる時間も、ひとりでほっと温まる時間も、どちらもあなたにとって大切な時間です。","心のブレーキは、責める言葉ではなく、ゆるす言葉で外れていきます。「それでも大丈夫」。今日はこの言葉を、何度でも自分に。","11月の最後の日。ひと月を過ごしてきた自分に「おつかれさま、ありがとう」。12月も、あなたのペースで歩いていきましょう。"],"12":["今年最後の月、12月のはじまりです。ここまで11か月を歩いてきた自分に、まずは「ありがとう」。残りのひと月も、あなたのペースで大丈夫です。","師走は、先生も走るほど忙しい月といわれます。まわりが急いでいても、あなたまで走らなくていいんです。今日は、ゆっくり歩くことを大切にしましょう。","冷たい風が吹く日は、マフラーで首もとを包みましょう。首が温まると、体全体がほっとゆるみます。体を守ることは、心を守ることにもつながっています。","年末に向けて、やることが増えてくる時期です。全部を完璧にこなさなくても大丈夫。「これだけできたら十分」と、自分で合格ラインを下げてあげましょう。","冬の夜空は、星がいちばんきれいに見える季節です。寒い夜こそ、星の光はくっきりと輝きます。今夜は少しだけ空を見上げて、星に今年の「ありがとう」を伝えてみましょう。","人が集まる場所に行く予定が続く時は、その前後にひとりで休む時間を作っておきましょう。心の充電をしてから出かけると、疲れ方がやさしくなります。","大雪、山に雪が積もりはじめる頃です。雪がしんしんと降り積もるように、毎日の小さな「ありがとう」も、気づけば心にたくさん積もっていきます。","今年いちばんうれしかったことは何でしたか。大きなことでなくてもかまいません。思い出すだけで心が温まる記憶は、あなたが受けとった大切な贈りものです。","街のイルミネーションが、きらきらと輝いています。まぶしすぎて疲れる日は、遠くからそっと眺めるだけでも十分。自分に合った楽しみ方で大丈夫です。","年賀状を書くように、今年お世話になった人を思い浮かべてみましょう。心の中で「ありがとう」と伝えるだけでも、温かい気持ちが届いていきます。","忙しい日が続くと、ごはんを急いで食べてしまいがちです。今日はひと口ずつ、ゆっくり味わってみましょう。ていねいに食べることは、自分を大切にすることです。","今年できなかったことを数えるより、今年乗りこえたことを数えてみましょう。きっと、思っているよりずっとたくさんのことを、あなたは乗りこえてきました。","大掃除は、一日で全部しなくても大丈夫です。今日は引き出しひとつだけ。物を片づけると、心の中も少しずつすっきりと片づいていきます。","「もう年末なのに何もできていない」と焦る日は、深呼吸をして「わたしは今年も生きぬいた」と言ってあげましょう。それだけで、すばらしい一年です。","12月も半分が過ぎました。あわただしい毎日の中で、今日まで来られた自分に「おつかれさま」。少し立ち止まって、温かい飲みもので休みましょう。","忘年会など、人と会う機会が増える時期ですね。参加しない選択をしても大丈夫。自分の心と体を大切にすることも、立派な一年の締めくくり方です。","南天の赤い実は「難を転じる」縁起ものといわれます。つらかった出来事も、いつかあなたを支える力に転じていきます。今年の経験も、すべてが宝物です。","寒い朝、お布団から出るのがつらい日もありますね。起きられたら、それだけで今日の一番目の「できた」です。自分に小さな拍手を送ってあげましょう。","今年、あなたを助けてくれた言葉を思い出してみましょう。誰かの言葉でも、自分で自分にかけた言葉でも。その言葉を、来年も大切に持っていきましょう。","一年の疲れが、どっと出やすい時期です。頭が重い日は、無理をせずに早めに休みましょう。「今年も本当によくがんばったね」と、体をねぎらってください。","冬至の前の日。明日から少しずつ日が長くなっていきます。いちばん暗い時期を越えたら、あとは光が増えていくだけ。心にも、もうすぐ光がさしてきます。","冬至、一年でいちばん夜が長い日です。ゆず湯につかって、かぼちゃを食べて、体をいたわりましょう。ゆずの香りが、心までやさしくほどいてくれます。","一年を振り返ると、うまくいかなかったことばかり思い出してしまう日もありますね。でも、その一つひとつが、今のやさしいあなたを作ってくれています。","クリスマスイブ。誰かにプレゼントを贈るように、自分にも小さな贈りものを。好きな音楽、温かいお茶、ゆっくり眠る時間。自分へのごほうびを大切に。","クリスマス。にぎやかに過ごす人も、静かに過ごす人も、どちらもすてきなクリスマスです。あなたの過ごし方が、あなたにとっていちばんの正解ですよ。","クリスマスが終わると、街は一気にお正月の準備に変わります。季節の切りかえが早い時期は、心も置いていかれそうになります。ゆっくりついていけば大丈夫。","今年、あなたが自分にかけた言葉の中で、いちばんやさしかった言葉は何ですか。その言葉を来年も続けていけば、心のブレーキは少しずつ外れていきます。","仕事納めのころ。一年間、毎日働いてくれた手と足、そして心に「ありがとう」。休むことに罪悪感を持たず、たっぷりと自分を休ませてあげましょう。","お正月の準備は、できる範囲で十分です。完璧なお正月より、心穏やかなお正月のほうが、ずっと大切。肩の力を抜いて、新しい年を迎える準備をしましょう。","来年の自分に、ひとつだけ手紙を書くとしたら、どんな言葉を贈りますか。「来年もあなたのペースで大丈夫」。その言葉が、新しい一年のお守りになります。","大晦日。一年間、本当によくがんばりましたね。除夜の鐘の音とともに、今年の自分に心から「ありがとう」。明日からの新しい一年も、やさしく歩いていきましょう。"]};
const THEMES = {
  1:{name:"睦月",season:"新春",icon:"🎍",a:"#c0392b",b:"#e3b04b",tint:"#fbf1ec"},
  2:{name:"如月",season:"梅のころ",icon:"🌸",a:"#b5577a",b:"#e7a3bb",tint:"#fbf0f3"},
  3:{name:"弥生",season:"春のめざめ",icon:"🌷",a:"#d0708c",b:"#f2c14e",tint:"#fdf3f4"},
  4:{name:"卯月",season:"桜のころ",icon:"🌸",a:"#d9829a",b:"#f6c6d2",tint:"#fdf4f6"},
  5:{name:"皐月",season:"新緑",icon:"🌿",a:"#4f9a5a",b:"#a8d08d",tint:"#f1f8ef"},
  6:{name:"水無月",season:"紫陽花と雨",icon:"☔",a:"#5b6fb5",b:"#a9b8e6",tint:"#f0f2fa"},
  7:{name:"文月",season:"七夕と夏空",icon:"🎋",a:"#2f86c4",b:"#8fd0ee",tint:"#eef6fb"},
  8:{name:"葉月",season:"ひまわりの夏",icon:"🌻",a:"#d4880f",b:"#f5cf55",tint:"#fdf7e8"},
  9:{name:"長月",season:"お月見",icon:"🌕",a:"#7d65a8",b:"#e8c66d",tint:"#f5f2fa"},
 10:{name:"神無月",season:"実りの秋",icon:"🌾",a:"#b0662a",b:"#e5b066",tint:"#fbf4ea"},
 11:{name:"霜月",season:"紅葉のころ",icon:"🍁",a:"#b8502b",b:"#e08a3c",tint:"#fbf3ea"},
 12:{name:"師走",season:"冬至と雪",icon:"❄️",a:"#3d6b8c",b:"#9cc3dc",tint:"#eff4f8"},
};
const WD = ["日","月","火","水","木","金","土"];
// 表紙の四季の絵で、それぞれの季節がある場所（春＝左上、夏＝右上、秋＝右下、冬＝左下）
const SPOT = { spring: ["22%", "22%"], summer: ["80%", "24%"], autumn: ["78%", "74%"], winter: ["20%", "76%"] };
const seasonOf = m => (m >= 3 && m <= 5) ? "spring" : (m >= 6 && m <= 8) ? "summer" : (m >= 9 && m <= 11) ? "autumn" : "winter";
const $ = id => document.getElementById(id);
let preview = location.hash === "#preview";
let now = new Date();

(function () { // 花形の枠
  let d = ""; const n = 8, R = 47, r = 8;
  for (let i = 0; i <= 360; i++) { const t = i * Math.PI / 180, rr = R + r * Math.abs(Math.cos(n * t / 2)); d += (i ? "L" : "M") + (rr * Math.cos(t)).toFixed(2) + " " + (rr * Math.sin(t)).toFixed(2); }
  $("scallop").setAttribute("d", d + "Z");
})();

function render() {
  const m = now.getMonth() + 1, d = now.getDate(), w = WD[now.getDay()];
  const T = THEMES[m], list = WORDS[String(m)] || [];
  const R = document.documentElement.style;
  R.setProperty("--a", T.a); R.setProperty("--b", T.b);
  const [ox, oy] = SPOT[seasonOf(m)];
  $("cover").style.setProperty("--ox", ox); $("cover").style.setProperty("--oy", oy);
  $("month").style.backgroundImage = `url("img/m${String(m).padStart(2, "0")}.jpg")`;
  $("chip").textContent = `${m}月　${T.name}・${T.season}`;
  $("dnum").textContent = d;
  $("dateline").textContent = `${m}月${d}日（${w}曜日）`;
  $("klabel").textContent = `${d}日のことば`;
  $("word").textContent = list[d - 1] || list[list.length - 1] || "";
  document.body.classList.remove("go");
  if (preview) { $("preview").hidden = false; $("pdate").value = `${now.getFullYear()}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
}
function go() {
  if (document.body.classList.contains("go")) return;
  document.body.classList.add("go");
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setTimeout(fall, 2600);
}
function fall() {
  const T = THEMES[now.getMonth() + 1], box = $("fall");
  for (let i = 0; i < 16; i++) {
    const p = document.createElement("i");
    p.style.left = (Math.random() * 100) + "vw";
    p.style.background = i % 3 ? T.b : T.a;
    p.style.setProperty("--x", ((Math.random() - .5) * 140) + "px");
    p.style.setProperty("--rr", (Math.random() * 540) + "deg");
    p.style.animationDuration = (6 + Math.random() * 5) + "s";
    p.style.animationDelay = (Math.random() * 2) + "s";
    box.appendChild(p); setTimeout(() => p.remove(), 14000);
  }
}
$("start").addEventListener("click", go);
$("again").addEventListener("click", () => { render(); });
$("pdate").addEventListener("change", e => { const [y, mo, da] = e.target.value.split("-").map(Number); if (y) { now = new Date(y, mo - 1, da); render(); } });
// 今月の絵を先に読みこんでおく（タップしたとき、すぐ場面が変わるように）
render();
</script>
</body>
</html>
